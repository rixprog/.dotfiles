# Add your additional Hyprland configurations here
#
# This is an additional key binding
# bind = $mainMod CTRL, up, workspace, empty

bind = $mainMod, P, exec, flatpak run com.spotify.Client

# Now-playing popup (art, controls, seek slider, lyrics); same key closes it
bind = $mainMod SHIFT, P, exec, ~/.local/bin/music-popup
layerrule = blur, music-popup
layerrule = ignorezero, music-popup

# WhatsApp Web sidepad (Brave app window, pre-loaded and parked off the left edge)
exec-once = ~/.local/bin/whatsapp-web --start
bind = $mainMod, W, exec, ~/.local/bin/whatsapp-web
windowrule = float, class:^(brave-web\.whatsapp\.com__-Default)$
windowrule = pin, class:^(brave-web\.whatsapp\.com__-Default)$

#
# Example for xwayland
# xwayland {
#   force_zero_scaling = true
# }

# qt5ct environment variable
# env = QT_QPA_PLATFORMTHEME,qt5ct

# SDL version
env = SDL_VIDEODRIVER,wayland
# env = SDL_VIDEODRIVER,x11

# No Hardware Cursor
# cursor {
#     no_hardware_cursors = false
# }

# Blur for waybar
#layerrule = blur, waybar

# Uncomment in case you have issues with screensharing
# exec-once = ~/.config/hypr/scripts/xdg.sh

general {
    border_size = 3
    gaps_in = 4
    gaps_out = 10
    col.active_border = rgba(709dd9ff)
}

